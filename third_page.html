<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>
* {
    box-sizing: border-box;
    font-family: "Comic Sans MS", cursive;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffdce7, #ffb6ca);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
}

.container {
    width: min(1100px, 94vw);
    text-align: center;
}

h1 {
    color: #641331;
    margin-bottom: 35px;
}

.boxes {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 18px;
}

.box {
    height: 200px;
    border: none;
    border-radius: 22px;
    background: rgba(255,255,255,0.35);
    box-shadow: 0 10px 25px rgba(90, 18, 48, 0.15);
    cursor: pointer;
    color: #641331;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    padding: 10px 6px;
    transition: transform .25s, box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
}

.box img.chest {
    height: 150px;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    pointer-events: none;
    user-select: none;
    filter: drop-shadow(0 6px 6px rgba(90,18,48,.25));
}

.box:hover {
    transform: translateY(-8px) scale(1.03);
    box-shadow: 0 18px 35px rgba(90, 18, 48, 0.25);
}

.box:active {
    transform: scale(.96);
}

.box.opening {
    animation: shake .35s ease-in-out;
}

@keyframes shake {
    0%,100% { transform: rotate(0); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
}

/* Popup */
.popup {
    position: fixed;
    inset: 0;
    background: rgba(20, 5, 12, 0.72);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 100;
}

.popup.show {
    display: flex;
}

.photo-card {
    position: relative;
    max-width: min(90vw, 650px);
    max-height: 88vh;
    padding: 12px;
    background: white;
    border-radius: 24px;
    box-shadow: 0 25px 70px rgba(0,0,0,.35);
    animation: popIn .5s cubic-bezier(.17,.67,.25,1.25);
}

.photo-card img {
    display: block;
    max-width: 100%;
    max-height: 78vh;
    border-radius: 16px;
    object-fit: contain;
}

.close {
    position: absolute;
    top: -15px;
    right: -15px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #e0245e;
    color: white;
    font-size: 25px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,.25);
}

.caption {
    margin: 12px 5px 4px;
    color: #641331;
    font-weight: bold;
    font-size: 18px;
}

@keyframes popIn {
    0% {
        opacity: 0;
        transform: scale(.35) rotate(-8deg);
    }
    70% {
        transform: scale(1.05) rotate(2deg);
    }
    100% {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

/* Mobile */
@media (max-width: 700px) {
    .boxes {
        grid-template-columns: repeat(2, 1fr);
    }

    .box {
        height: 170px;
    }

    .box:last-child {
        grid-column: span 2;
    }
}
.next-btn {
    display: block;
    width: 155px;
    padding: 17px 0;
    margin: 40px auto 10px;

    background: #e91e63;
    color: white;
    text-align: center;
    text-decoration: none;

    font-family: Arial, sans-serif;
    font-size: 21px;
    font-weight: bold;

    border-radius: 50px;
    box-shadow: 0 8px 18px rgba(233, 30, 99, 0.25);

    /* Gentle bounce */
    animation: bounce 1.5s infinite;
}

@keyframes bounce {
    0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
    }

    40% {
        transform: translateY(-10px);
    }

    60% {
        transform: translateY(-5px);
    }
}

.next-btn:hover {
    background: #d81b60;
}
@media (max-width: 400px) {
    .boxes {
        grid-template-columns: 1fr;
    }

    .box:last-child {
        grid-column: auto;
    }
}
</style>
</head>

<div class="container">

        <button class="box" data-photo="cute_us.jpg" data-caption="Bale cute ga anipinchindhi😁">
            <img class="chest" src="cute_us.jpg" alt="Box 3">

        <button class="box" data-photo="my_fav.jpg" data-caption="Naa favvvv piccc Nito💖">
            <img class="chest" src="my_fav.jpg" alt="Box 4">

// preload
FRAMES.forEach(src => { const i = new Image(); i.src = src; });

const boxes = document.querySelectorAll(".box");
const popup = document.getElementById("popup");
const popupImage = document.getElementById("popupImage");
const caption = document.getElementById("caption");
const closeBtn = document.getElementById("close");

const FRAME_MS = 90;
let activeBox = null;

boxes.forEach(box => {
    const img = box.querySelector(".chest");
    img.src = FRAMES[0];               // closed by default
    box._img = img;
    box._busy = false;

    box.addEventListener("click", () => {
        if (box._busy || activeBox) return;
        box._busy = true;
        activeBox = box;
        box.classList.add("opening");
        playFrames(img, 0, FRAMES.length - 1, () => {
            box.classList.remove("opening");
            popupImage.src = box.dataset.photo;
            popupImage.alt = box.dataset.caption;
            caption.textContent = box.dataset.caption;
            popup.classList.add("show");
        });
    });
});

function playFrames(img, from, to, done) {
    const step = from < to ? 1 : -1;
    let i = from;
    const timer = setInterval(() => {
        i += step;
        img.src = FRAMES[i];
        if (i === to) {
            clearInterval(timer);
            if (done) done();
        }
    }, FRAME_MS);
}

function closePopup() {
    if (!popup.classList.contains("show")) return;
    popup.classList.remove("show");
    popupImage.src = "";
    const box = activeBox;
    if (box) {
        // close the chest again
        playFrames(box._img, FRAMES.length - 1, 0, () => {
            box._busy = false;
            activeBox = null;
        });
    }
}

closeBtn.addEventListener("click", closePopup);

popup.addEventListener("click", (event) => {
    if (event.target === popup) closePopup();
});

document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closePopup();
});
</script>
